<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NZR Crusher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0a0c10; --bg2: #12151b; --bg3: #1a1e27; --bg4: #242a35;
  --fg: #e0e4eb; --fg2: #7a8494; --fg3: #3d4654;
  --accent: #4a9eff; --warm: #f59e0b; --red: #ef5350; --green: #2dd4a0; --purple: #a78bfa;
  --border: #252b38;
  font-family: 'Inter', system-ui, sans-serif; color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }

.top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.top h1 { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }
.top .hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--fg3); margin-left: auto; }

.drop {
  margin: 12px 20px 0; padding: 24px; border: 2px dashed var(--border); border-radius: 8px;
  text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--fg2);
  cursor: pointer; transition: all 0.15s;
}
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: rgba(74,158,255,0.03); }
.drop.loaded {
  padding: 8px 20px; text-align: left; border-style: solid; border-color: var(--border);
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
.drop .fname { color: var(--fg); font-weight: 700; font-size: 14px; }
.drop .meta { color: var(--fg2); font-size: 11px; }
input[type="file"] { display: none; }

.wave-box {
  margin: 8px 20px; height: 90px; background: var(--bg2); border-radius: 8px;
  border: 1px solid var(--border); position: relative; overflow: hidden; display: none;
}
.wave-box.show { display: block; }
.wave-box canvas { width: 100%; height: 100%; display: block; }
.wave-box .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); left: 0; display: none; pointer-events: none; }
.sel-info {
  position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent);
  background: rgba(10,12,16,0.85); padding: 2px 10px; border-radius: 3px;
  pointer-events: none; display: none; white-space: nowrap;
}
.sel-info.show { display: block; }

.presets { display: flex; gap: 6px; padding: 8px 20px; flex-wrap: wrap; }
.preset-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--fg2); cursor: pointer; transition: all 0.12s;
  letter-spacing: 0.5px;
}
.preset-btn:hover { border-color: var(--accent); color: var(--fg); }
.preset-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

.knobs { display: flex; justify-content: center; gap: 24px; padding: 16px 20px 10px; flex-wrap: wrap; }
.knob-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.knob-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  color: var(--fg2); letter-spacing: 1.5px; text-transform: uppercase;
}
.knob-wrap { position: relative; width: 72px; height: 72px; }
.knob-wrap canvas { width: 100%; height: 100%; cursor: pointer; }
.knob-val {
  position: absolute; bottom: -2px; left: 0; right: 0; text-align: center;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
  color: var(--fg); pointer-events: none;
}

.mode-row { display: flex; justify-content: center; gap: 6px; padding: 0 20px 10px; }
.mode-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--bg4); color: var(--fg3); cursor: pointer; transition: all 0.1s;
}
.mode-btn:hover { color: var(--fg2); }
.mode-btn.active { border-color: var(--red); color: var(--red); background: rgba(239,83,80,0.1); }

.section-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  color: var(--fg3); letter-spacing: 2px; padding: 8px 20px 4px; text-transform: uppercase;
  border-top: 1px solid var(--border);
}

.fx-rack { padding: 4px 20px 8px; display: flex; flex-direction: column; gap: 6px; }
.fx-row {
  display: flex; align-items: center; gap: 10px; padding: 5px 10px;
  background: var(--bg2); border-radius: 6px; border: 1px solid var(--border);
}
.fx-toggle {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
  padding: 3px 8px; border-radius: 3px; border: 1px solid var(--border);
  background: var(--bg4); color: var(--fg3); cursor: pointer; min-width: 32px;
  transition: all 0.1s;
}
.fx-toggle.on { border-color: var(--green); color: var(--green); background: rgba(45,212,160,0.1); }
.fx-name {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  color: var(--fg2); min-width: 80px; letter-spacing: 0.5px;
}
.fx-slider { display: flex; align-items: center; gap: 6px; flex: 1; }
.fx-slider label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--fg3);
  min-width: 36px; text-transform: uppercase;
}
.fx-slider input[type="range"] {
  -webkit-appearance: none; flex: 1; height: 3px; background: var(--bg4);
  border-radius: 2px; outline: none;
}
.fx-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 1.5px solid var(--bg);
}
.fx-slider .fx-val {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--fg2);
  min-width: 44px; text-align: right;
}

.action-row {
  display: flex; gap: 5px; padding: 6px 20px 8px; flex-wrap: wrap;
}
.action-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--fg2); cursor: pointer; transition: all 0.1s;
}
.action-btn:hover { border-color: var(--accent); color: var(--fg); }
.action-btn:disabled { opacity: 0.25; pointer-events: none; }
.action-btn.undo { border-color: var(--warm); color: var(--warm); }
.action-btn.undo:hover { background: var(--warm); color: #000; }

.play-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 20px;
  background: var(--bg2); border-top: 1px solid var(--border); margin-top: auto;
}
.play-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
  padding: 6px 18px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.1s;
}
.play-btn.main { background: var(--accent); color: #000; }
.play-btn.main:hover { filter: brightness(1.15); }
.play-btn.dry { background: var(--bg4); color: var(--fg2); border: 1px solid var(--border); }
.play-btn.dry:hover { color: var(--fg); border-color: var(--fg3); }
.play-btn.export { background: transparent; color: var(--green); border: 1px solid var(--green); }
.play-btn.export:hover { background: var(--green); color: #000; }
.play-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
.spacer { flex: 1; }
.status { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--fg3); }
</style>
</head>
<body>

<div class="top">
  <h1>NZR CRUSHER</h1>
  <div class="hint">Space=Play D=Dry E=Export R=Reverse Ctrl+Z=Undo</div>
</div>

<div class="drop" id="drop">Drop WAV here or click to load</div>
<input type="file" id="fileIn" accept=".wav">

<div class="wave-box" id="waveBox">
  <canvas id="waveC"></canvas>
  <div class="ph" id="ph"></div>
  <div class="sel-info" id="selInfo"></div>
</div>

<div class="presets" id="presets">
  <button class="preset-btn active" data-p="clean">CLEAN</button>
  <button class="preset-btn" data-p="warm">WARM</button>
  <button class="preset-btn" data-p="punch">PUNCH</button>
  <button class="preset-btn" data-p="grit">GRIT</button>
  <button class="preset-btn" data-p="crush">CRUSH</button>
  <button class="preset-btn" data-p="destroy">DESTROY</button>
</div>

<div class="knobs" id="knobs">
  <div class="knob-group">
    <div class="knob-label">Distortion</div>
    <div class="knob-wrap"><canvas id="kDist" width="144" height="144"></canvas><div class="knob-val" id="vDist">0%</div></div>
  </div>
  <div class="knob-group">
    <div class="knob-label">Compress</div>
    <div class="knob-wrap"><canvas id="kComp" width="144" height="144"></canvas><div class="knob-val" id="vComp">0%</div></div>
  </div>
  <div class="knob-group">
    <div class="knob-label">Filter</div>
    <div class="knob-wrap"><canvas id="kFilt" width="144" height="144"></canvas><div class="knob-val" id="vFilt">100%</div></div>
  </div>
  <div class="knob-group">
    <div class="knob-label">Master</div>
    <div class="knob-wrap"><canvas id="kMast" width="144" height="144"></canvas><div class="knob-val" id="vMast">80%</div></div>
  </div>
</div>

<div class="mode-row">
  <button class="mode-btn active" data-m="tube">TUBE</button>
  <button class="mode-btn" data-m="hard">HARD</button>
  <button class="mode-btn" data-m="fold">FOLD</button>
  <button class="mode-btn" data-m="rectify">RECTIFY</button>
</div>

<div class="section-label">FX RACK</div>
<div class="fx-rack">
  <div class="fx-row">
    <button class="fx-toggle" id="ringOn">OFF</button>
    <span class="fx-name">RING MOD</span>
    <div class="fx-slider"><label>Freq</label><input type="range" id="ringFreq" min="1" max="2000" value="100" step="1"><span class="fx-val" id="ringFreqV">100 Hz</span></div>
    <div class="fx-slider"><label>Mix</label><input type="range" id="ringMix" min="0" max="100" value="100"><span class="fx-val" id="ringMixV">100%</span></div>
  </div>
  <div class="fx-row">
    <button class="fx-toggle" id="combOn">OFF</button>
    <span class="fx-name">COMB</span>
    <div class="fx-slider"><label>Time</label><input type="range" id="combTime" min="1" max="50" value="5" step="0.5"><span class="fx-val" id="combTimeV">5 ms</span></div>
    <div class="fx-slider"><label>Feedb</label><input type="range" id="combFb" min="0" max="95" value="60"><span class="fx-val" id="combFbV">60%</span></div>
  </div>
  <div class="fx-row">
    <button class="fx-toggle" id="crushOn">OFF</button>
    <span class="fx-name">BITCRUSH</span>
    <div class="fx-slider"><label>Bits</label><input type="range" id="crushBits" min="1" max="16" value="8"><span class="fx-val" id="crushBitsV">8 bit</span></div>
  </div>
</div>

<div class="section-label">DESTRUCTIVE OPS</div>
<div class="action-row">
  <button class="action-btn" id="actReverse" disabled>REVERSE</button>
  <button class="action-btn" id="actStutter2" disabled>STUTTER ×2</button>
  <button class="action-btn" id="actStutter4" disabled>×4</button>
  <button class="action-btn" id="actStutter8" disabled>×8</button>
  <button class="action-btn" id="actHalf" disabled>½ SPEED</button>
  <button class="action-btn" id="actDouble" disabled>2× SPEED</button>
  <button class="action-btn undo" id="actUndo" disabled>UNDO</button>
</div>

<div class="play-bar">
  <button class="play-btn main" id="btnPlay" disabled>&#9654; PLAY</button>
  <button class="play-btn dry" id="btnDry" disabled>DRY</button>
  <button class="play-btn export" id="btnExport" disabled>EXPORT</button>
  <div class="spacer"></div>
  <div class="status" id="status">Drop a sample to start</div>
</div>

<script type="module">
import { makeDistortionCurve } from './js/distortion.js';
import { encodeWav24 } from './js/wav-encoder.js';

const $ = id => document.getElementById(id);
let actx = null, sampleBuf = null, fileName = '', playSrc = null, isPlaying = false, animF = null;
let distMode = 'tube';
const undoStack = [];
const MAX_UNDO = 10;

let sel = { start: 0, end: 1 };
let selDrag = null;
let selAnchor = 0;

function hasSelection() { return sel.start > 0.002 || sel.end < 0.998; }
function selStartSec() { return sel.start * sampleBuf.duration; }
function selEndSec() { return sel.end * sampleBuf.duration; }
function selDurSec() { return (sel.end - sel.start) * sampleBuf.duration; }
function selStartIdx() { return Math.floor(sel.start * sampleBuf.length); }
function selEndIdx() { return Math.floor(sel.end * sampleBuf.length); }

function fmtTime(sec) {
  const m = Math.floor(sec / 60);
  const s = (sec % 60).toFixed(3);
  return m + ':' + s.padStart(6, '0');
}

function updateSelInfo() {
  const info = $('selInfo');
  if (!sampleBuf || !hasSelection()) { info.classList.remove('show'); return; }
  info.textContent = fmtTime(selStartSec()) + ' – ' + fmtTime(selEndSec()) + ' (' + selDurSec().toFixed(3) + 's)';
  info.classList.add('show');
}

const knobs = { dist: 0, comp: 0, filt: 1, mast: 0.8 };
const knobColors = { dist: '#ef5350', comp: '#a78bfa', filt: '#f59e0b', mast: '#4a9eff' };
const knobIds = { dist: 'kDist', comp: 'kComp', filt: 'kFilt', mast: 'kMast' };
const knobValIds = { dist: 'vDist', comp: 'vComp', filt: 'vFilt', mast: 'vMast' };

const presets = {
  clean:   { dist: 0,    comp: 0,    filt: 1,    mast: 0.8, mode: 'tube' },
  warm:    { dist: 0.2,  comp: 0.3,  filt: 0.85, mast: 0.8, mode: 'tube' },
  punch:   { dist: 0.15, comp: 0.65, filt: 0.9,  mast: 0.85, mode: 'tube' },
  grit:    { dist: 0.45, comp: 0.4,  filt: 0.75, mast: 0.75, mode: 'hard' },
  crush:   { dist: 0.7,  comp: 0.6,  filt: 0.6,  mast: 0.7, mode: 'fold' },
  destroy: { dist: 1.0,  comp: 0.85, filt: 0.4,  mast: 0.6, mode: 'rectify' },
};

function initAudio() {
  if (!actx) actx = new AudioContext();
  if (actx.state === 'suspended') actx.resume();
}

function drawKnob(id, value, color) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height, cx = w / 2, cy = h / 2, r = w * 0.36;
  ctx.clearRect(0, 0, w, h);
  const startAngle = Math.PI * 0.75, endAngle = Math.PI * 2.25;
  const valAngle = startAngle + value * (endAngle - startAngle);
  ctx.beginPath(); ctx.arc(cx, cy, r, startAngle, endAngle);
  ctx.strokeStyle = '#1a1e27'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
  if (value > 0.005) {
    ctx.beginPath(); ctx.arc(cx, cy, r, startAngle, valAngle);
    ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
  }
  const dx = cx + Math.cos(valAngle) * (r - 1), dy = cy + Math.sin(valAngle) * (r - 1);
  ctx.beginPath(); ctx.arc(dx, dy, 5, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.45, 0, Math.PI * 2); ctx.fillStyle = '#12151b'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.45, 0, Math.PI * 2); ctx.strokeStyle = '#252b38'; ctx.lineWidth = 1.5; ctx.stroke();
}

function updateKnobDisplay(k) {
  drawKnob(knobIds[k], knobs[k], knobColors[k]);
  $(knobValIds[k]).textContent = Math.round(knobs[k] * 100) + '%';
}
function drawAll() { for (const k in knobs) updateKnobDisplay(k); }
drawAll();

let dragging = null, dragStartY = 0, dragStartVal = 0;
for (const k in knobIds) {
  const canvas = $(knobIds[k]);
  canvas.addEventListener('mousedown', e => { dragging = k; dragStartY = e.clientY; dragStartVal = knobs[k]; e.preventDefault(); });
  canvas.addEventListener('wheel', e => { e.preventDefault(); knobs[k] = Math.max(0, Math.min(1, knobs[k] - e.deltaY * 0.001)); updateKnobDisplay(k); clearActivePreset(); });
}
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  knobs[dragging] = Math.max(0, Math.min(1, dragStartVal + (dragStartY - e.clientY) * 0.005));
  updateKnobDisplay(dragging);
  clearActivePreset();
});
document.addEventListener('mouseup', () => { dragging = null; });

function applyPreset(name) {
  const p = presets[name];
  knobs.dist = p.dist; knobs.comp = p.comp; knobs.filt = p.filt; knobs.mast = p.mast;
  distMode = p.mode;
  drawAll();
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.p === name));
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.m === distMode));
}
function clearActivePreset() { document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active')); }
document.querySelectorAll('.preset-btn').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.p)));
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => {
  distMode = b.dataset.m;
  document.querySelectorAll('.mode-btn').forEach(x => x.classList.toggle('active', x.dataset.m === distMode));
  clearActivePreset();
}));

// ===== FX RACK STATE =====
const fx = {
  ringOn: false, ringFreq: 100, ringMix: 1.0,
  combOn: false, combTime: 5, combFb: 0.6,
  crushOn: false, crushBits: 8,
};

document.querySelectorAll('.fx-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.id;
    fx[key] = !fx[key];
    btn.classList.toggle('on', fx[key]);
    btn.textContent = fx[key] ? 'ON' : 'OFF';
  });
});

$('ringFreq').addEventListener('input', e => { fx.ringFreq = parseFloat(e.target.value); $('ringFreqV').textContent = fx.ringFreq + ' Hz'; });
$('ringMix').addEventListener('input', e => { fx.ringMix = parseFloat(e.target.value) / 100; $('ringMixV').textContent = Math.round(fx.ringMix * 100) + '%'; });
$('combTime').addEventListener('input', e => { fx.combTime = parseFloat(e.target.value); $('combTimeV').textContent = fx.combTime + ' ms'; });
$('combFb').addEventListener('input', e => { fx.combFb = parseFloat(e.target.value) / 100; $('combFbV').textContent = Math.round(fx.combFb * 100) + '%'; });
$('crushBits').addEventListener('input', e => { fx.crushBits = parseInt(e.target.value); $('crushBitsV').textContent = fx.crushBits + ' bit'; });

// ===== FILE LOADING =====
$('drop').addEventListener('click', () => $('fileIn').click());
$('fileIn').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
$('drop').addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

async function loadFile(file) {
  initAudio();
  fileName = file.name;
  sampleBuf = await actx.decodeAudioData(await file.arrayBuffer());
  undoStack.length = 0;
  onSampleLoaded();
}

function onSampleLoaded() {
  sel = { start: 0, end: 1 };
  $('drop').classList.add('loaded');
  $('drop').innerHTML = `<span class="fname">${fileName}</span><span class="meta">${sampleBuf.duration.toFixed(3)}s · ${sampleBuf.sampleRate}Hz · ${sampleBuf.numberOfChannels}ch</span>`;
  $('waveBox').classList.add('show');
  drawWave();
  updateSelInfo();
  $('btnPlay').disabled = false; $('btnDry').disabled = false; $('btnExport').disabled = false;
  document.querySelectorAll('.action-btn:not(.undo)').forEach(b => b.disabled = false);
  $('actUndo').disabled = undoStack.length === 0;
  $('status').textContent = 'Ready';
}

// ===== WAVEFORM DRAWING =====
function drawWave() {
  if (!sampleBuf) return;
  const c = $('waveC');
  const rect = c.parentElement.getBoundingClientRect();
  c.width = rect.width * devicePixelRatio; c.height = rect.height * devicePixelRatio;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height, mid = h / 2;
  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

  const data = sampleBuf.getChannelData(0), step = data.length / w;
  ctx.globalAlpha = 0.15; ctx.fillStyle = '#4a9eff';
  ctx.beginPath(); ctx.moveTo(0, mid);
  for (let x = 0; x < w; x++) {
    const i = Math.floor(x * step); let max = -1;
    for (let j = i; j < Math.min(i + Math.ceil(step), data.length); j++) if (data[j] > max) max = data[j];
    ctx.lineTo(x, mid - max * mid * 0.9);
  }
  for (let x = w - 1; x >= 0; x--) {
    const i = Math.floor(x * step); let min = 1;
    for (let j = i; j < Math.min(i + Math.ceil(step), data.length); j++) if (data[j] < min) min = data[j];
    ctx.lineTo(x, mid - min * mid * 0.9);
  }
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;

  ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let x = 0; x < w; x++) {
    const i = Math.floor(x * step); let peak = 0;
    for (let j = i; j < Math.min(i + Math.ceil(step), data.length); j++) if (Math.abs(data[j]) > Math.abs(peak)) peak = data[j];
    const y = mid - peak * mid * 0.9;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  if (hasSelection()) {
    const sx = sel.start * w, ex = sel.end * w;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    if (sel.start > 0) ctx.fillRect(0, 0, sx, h);
    if (sel.end < 1) ctx.fillRect(ex, 0, w - ex, h);
    ctx.strokeStyle = 'rgba(74,158,255,0.6)'; ctx.lineWidth = 1;
    ctx.strokeRect(sx, 0, ex - sx, h);
    ctx.fillStyle = '#4a9eff';
    ctx.fillRect(sx - 1.5, 0, 3, h);
    ctx.fillRect(ex - 1.5, 0, 3, h);
    const gh = 10;
    ctx.beginPath(); ctx.moveTo(sx, h/2 - gh); ctx.lineTo(sx + 6, h/2); ctx.lineTo(sx, h/2 + gh); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ex, h/2 - gh); ctx.lineTo(ex - 6, h/2); ctx.lineTo(ex, h/2 + gh); ctx.fill();
  }
}

// ===== WAVEFORM MOUSE =====
const waveC = $('waveC');
function mouseToFrac(e) { const r = waveC.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
function nearHandle(e) {
  const r = waveC.getBoundingClientRect(), mx = e.clientX - r.left;
  if (hasSelection() && Math.abs(mx - sel.start * r.width) < 8) return 'start';
  if (hasSelection() && Math.abs(mx - sel.end * r.width) < 8) return 'end';
  return null;
}
waveC.addEventListener('mousedown', e => {
  if (!sampleBuf) return; e.preventDefault();
  const h = nearHandle(e);
  if (h) { selDrag = h; } else { selDrag = 'new'; selAnchor = mouseToFrac(e); sel.start = selAnchor; sel.end = selAnchor; }
});
waveC.addEventListener('mousemove', e => {
  if (!sampleBuf) return;
  if (selDrag) {
    const f = mouseToFrac(e);
    if (selDrag === 'start') sel.start = Math.min(f, sel.end - 0.003);
    else if (selDrag === 'end') sel.end = Math.max(f, sel.start + 0.003);
    else { if (f < selAnchor) { sel.start = f; sel.end = selAnchor; } else { sel.start = selAnchor; sel.end = f; } }
    drawWave(); updateSelInfo(); return;
  }
  waveC.style.cursor = nearHandle(e) ? 'ew-resize' : 'crosshair';
});
document.addEventListener('mouseup', () => {
  if (selDrag === 'new' && Math.abs(sel.end - sel.start) < 0.005) { sel.start = 0; sel.end = 1; drawWave(); updateSelInfo(); }
  selDrag = null;
});
waveC.addEventListener('dblclick', () => { sel.start = 0; sel.end = 1; drawWave(); updateSelInfo(); });

// ===== BITCRUSHER CURVE =====
function makeBitcrushCurve(bits) {
  const steps = Math.pow(2, bits);
  const n = 8192;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (2 * i / (n - 1)) - 1;
    curve[i] = Math.round(x * (steps - 1)) / (steps - 1);
  }
  return curve;
}

// ===== FX CHAIN =====
function buildChain(ctx, src) {
  let cur = src;

  // Distortion
  if (knobs.dist > 0.01) {
    const ws = ctx.createWaveShaper();
    ws.curve = makeDistortionCurve(distMode, knobs.dist, 24);
    ws.oversample = '4x';
    cur.connect(ws); cur = ws;
  }

  // Compression
  if (knobs.comp > 0.01) {
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -6 - knobs.comp * 42;
    comp.ratio.value = 1 + knobs.comp * 18;
    comp.attack.value = 0.001 + (1 - knobs.comp) * 0.02;
    comp.release.value = 0.05 + (1 - knobs.comp) * 0.2;
    comp.knee.value = 4;
    cur.connect(comp); cur = comp;
    const makeup = ctx.createGain();
    makeup.gain.value = 1 + knobs.comp * 1.5;
    cur.connect(makeup); cur = makeup;
  }

  // Ring Mod
  if (fx.ringOn) {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = fx.ringFreq;
    const ringGain = ctx.createGain();
    ringGain.gain.value = 0;
    osc.connect(ringGain.gain);
    osc.start();

    const wet = ctx.createGain();
    wet.gain.value = fx.ringMix;
    cur.connect(ringGain);
    ringGain.connect(wet);

    const dry = ctx.createGain();
    dry.gain.value = 1 - fx.ringMix;
    cur.connect(dry);

    const mix = ctx.createGain();
    wet.connect(mix);
    dry.connect(mix);
    cur = mix;
  }

  // Comb Filter
  if (fx.combOn) {
    const delay = ctx.createDelay(0.1);
    delay.delayTime.value = fx.combTime / 1000;
    const fb = ctx.createGain();
    fb.gain.value = fx.combFb;
    const mix = ctx.createGain();
    cur.connect(mix);
    cur.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(mix);
    cur = mix;
  }

  // Bitcrusher
  if (fx.crushOn) {
    const ws = ctx.createWaveShaper();
    ws.curve = makeBitcrushCurve(fx.crushBits);
    ws.oversample = 'none';
    cur.connect(ws); cur = ws;
  }

  // Filter
  if (knobs.filt < 0.99) {
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 200 + knobs.filt * knobs.filt * 19800;
    filt.Q.value = 0.7 + (1 - knobs.filt) * 4;
    cur.connect(filt); cur = filt;
  }

  // Master
  const mast = ctx.createGain();
  mast.gain.value = knobs.mast;
  cur.connect(mast); cur = mast;
  return cur;
}

// ===== PLAYBACK =====
function stopPlayback() {
  if (playSrc) { try { playSrc.stop(); } catch {} playSrc = null; }
  isPlaying = false;
  if (animF) cancelAnimationFrame(animF);
  $('ph').style.display = 'none';
}

function play(dry = false) {
  if (!sampleBuf) return;
  initAudio(); stopPlayback();
  playSrc = actx.createBufferSource();
  playSrc.buffer = sampleBuf;
  const startSec = selStartSec(), durSec = selDurSec();
  if (dry) playSrc.connect(actx.destination);
  else buildChain(actx, playSrc).connect(actx.destination);
  const t0 = actx.currentTime;
  playSrc.start(0, startSec, durSec);
  isPlaying = true;
  $('status').textContent = dry ? 'Playing dry...' : 'Playing...';
  playSrc.onended = () => { isPlaying = false; $('ph').style.display = 'none'; $('status').textContent = 'Ready'; };
  $('ph').style.display = 'block';
  (function anim() {
    if (!isPlaying) return;
    const elapsed = actx.currentTime - t0;
    const pct = sel.start + elapsed / sampleBuf.duration;
    if (pct > sel.end || elapsed > durSec) { $('ph').style.display = 'none'; return; }
    $('ph').style.left = (pct * 100) + '%';
    animF = requestAnimationFrame(anim);
  })();
}

// ===== EXPORT =====
async function exportWav() {
  if (!sampleBuf) return;
  $('status').textContent = 'Rendering...';
  const startSec = selStartSec(), durSec = selDurSec();
  const renderLen = Math.ceil((durSec + 0.05) * sampleBuf.sampleRate);
  const offCtx = new OfflineAudioContext(sampleBuf.numberOfChannels, renderLen, sampleBuf.sampleRate);
  const src = offCtx.createBufferSource();
  src.buffer = sampleBuf;
  buildChain(offCtx, src).connect(offCtx.destination);
  src.start(0, startSec, durSec);
  const rendered = await offCtx.startRendering();

  const chs = [];
  for (let c = 0; c < rendered.numberOfChannels; c++) chs.push(rendered.getChannelData(c));
  let peak = 0;
  for (const d of chs) for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
  const target = Math.pow(10, -0.3 / 20);
  if (peak > 0.001) { const s = target / peak; for (const d of chs) for (let i = 0; i < d.length; i++) d[i] *= s; }

  const wavBuf = encodeWav24(rendered);
  const suffix = hasSelection() ? '_cut_crushed' : '_crushed';
  const name = fileName.replace(/\.wav$/i, '') + suffix + '.wav';
  window.parent.postMessage({ type: 'save-wav', buffer: wavBuf, name }, '*');
  $('status').textContent = 'Exported: ' + name;
}

// ===== DESTRUCTIVE OPS =====
function pushUndo() {
  const copy = actx.createBuffer(sampleBuf.numberOfChannels, sampleBuf.length, sampleBuf.sampleRate);
  for (let ch = 0; ch < sampleBuf.numberOfChannels; ch++) copy.getChannelData(ch).set(sampleBuf.getChannelData(ch));
  undoStack.push({ buf: copy, sel: { ...sel } });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  $('actUndo').disabled = false;
}

function applyBuffer(newBuf) {
  sampleBuf = newBuf;
  $('drop').innerHTML = `<span class="fname">${fileName}</span><span class="meta">${sampleBuf.duration.toFixed(3)}s · ${sampleBuf.sampleRate}Hz · ${sampleBuf.numberOfChannels}ch</span>`;
  drawWave();
  updateSelInfo();
}

function doUndo() {
  if (undoStack.length === 0) return;
  const prev = undoStack.pop();
  sampleBuf = prev.buf;
  sel = prev.sel;
  applyBuffer(sampleBuf);
  $('actUndo').disabled = undoStack.length === 0;
  $('status').textContent = 'Undo';
}

function doReverse() {
  if (!sampleBuf) return;
  initAudio(); pushUndo();
  const s = selStartIdx(), e = selEndIdx();
  for (let ch = 0; ch < sampleBuf.numberOfChannels; ch++) {
    const d = sampleBuf.getChannelData(ch);
    const slice = d.slice(s, e);
    slice.reverse();
    d.set(slice, s);
  }
  applyBuffer(sampleBuf);
  $('status').textContent = hasSelection() ? 'Selection reversed' : 'Reversed';
}

function doStutter(times) {
  if (!sampleBuf) return;
  initAudio(); pushUndo();
  const s = selStartIdx(), e = selEndIdx();
  const selLen = e - s;
  const newLen = sampleBuf.length - selLen + selLen * times;
  const newBuf = actx.createBuffer(sampleBuf.numberOfChannels, newLen, sampleBuf.sampleRate);
  for (let ch = 0; ch < sampleBuf.numberOfChannels; ch++) {
    const src = sampleBuf.getChannelData(ch);
    const dst = newBuf.getChannelData(ch);
    for (let i = 0; i < s; i++) dst[i] = src[i];
    for (let t = 0; t < times; t++) {
      for (let i = 0; i < selLen; i++) dst[s + t * selLen + i] = src[s + i];
    }
    const after = s + selLen * times;
    for (let i = e; i < sampleBuf.length; i++) dst[after + i - e] = src[i];
  }
  sel = { start: s / newLen, end: (s + selLen * times) / newLen };
  applyBuffer(newBuf);
  $('status').textContent = 'Stutter ×' + times;
}

function doHalfSpeed() {
  if (!sampleBuf) return;
  initAudio(); pushUndo();
  const newLen = sampleBuf.length * 2;
  const newBuf = actx.createBuffer(sampleBuf.numberOfChannels, newLen, sampleBuf.sampleRate);
  for (let ch = 0; ch < sampleBuf.numberOfChannels; ch++) {
    const src = sampleBuf.getChannelData(ch);
    const dst = newBuf.getChannelData(ch);
    for (let i = 0; i < newLen; i++) {
      const srcIdx = i / 2;
      const i0 = Math.floor(srcIdx);
      const i1 = Math.min(i0 + 1, src.length - 1);
      const f = srcIdx - i0;
      dst[i] = src[i0] * (1 - f) + src[i1] * f;
    }
  }
  sel = { start: 0, end: 1 };
  applyBuffer(newBuf);
  $('status').textContent = '½ Speed (-1 octave)';
}

function doDoubleSpeed() {
  if (!sampleBuf) return;
  initAudio(); pushUndo();
  const newLen = Math.floor(sampleBuf.length / 2);
  const newBuf = actx.createBuffer(sampleBuf.numberOfChannels, newLen, sampleBuf.sampleRate);
  for (let ch = 0; ch < sampleBuf.numberOfChannels; ch++) {
    const src = sampleBuf.getChannelData(ch);
    const dst = newBuf.getChannelData(ch);
    for (let i = 0; i < newLen; i++) {
      const srcIdx = i * 2;
      const i0 = Math.floor(srcIdx);
      const i1 = Math.min(i0 + 1, src.length - 1);
      const f = srcIdx - i0;
      dst[i] = src[i0] * (1 - f) + src[i1] * f;
    }
  }
  sel = { start: 0, end: 1 };
  applyBuffer(newBuf);
  $('status').textContent = '2× Speed (+1 octave)';
}

// ===== EVENT BINDINGS =====
$('btnPlay').addEventListener('click', () => play(false));
$('btnDry').addEventListener('click', () => play(true));
$('btnExport').addEventListener('click', exportWav);
$('actReverse').addEventListener('click', doReverse);
$('actStutter2').addEventListener('click', () => doStutter(2));
$('actStutter4').addEventListener('click', () => doStutter(4));
$('actStutter8').addEventListener('click', () => doStutter(8));
$('actHalf').addEventListener('click', doHalfSpeed);
$('actDouble').addEventListener('click', doDoubleSpeed);
$('actUndo').addEventListener('click', doUndo);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (isPlaying) stopPlayback(); else play(false); }
  if (k === 'd') play(true);
  if (k === 'e') exportWav();
  if (k === 'r') doReverse();
  if (k === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doUndo(); }
  if (k === 'escape' && sampleBuf) { sel.start = 0; sel.end = 1; drawWave(); updateSelInfo(); }
});

new ResizeObserver(() => { if (sampleBuf) drawWave(); }).observe(document.body);

window.addEventListener('message', async e => {
  if (e.data.type === 'load-sample' && e.data.data) {
    initAudio();
    fileName = e.data.name || 'sample.wav';
    const arrayBuf = e.data.data instanceof ArrayBuffer ? e.data.data : e.data.data.buffer.slice(e.data.data.byteOffset, e.data.data.byteOffset + e.data.data.byteLength);
    sampleBuf = await actx.decodeAudioData(arrayBuf);
    undoStack.length = 0;
    onSampleLoaded();
  }
});
</script>
